[project]
name = "ta-exec-data-gen"
version = "0.1.0"
description = "Deterministic synthetic ATS and HR source data for the TA Executive Dashboard (ta-exec-db contract)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.scripts]
ta-gen = "ta_exec_data_gen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
