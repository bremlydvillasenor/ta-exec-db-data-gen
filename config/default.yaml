# Default generation configuration for the TA Executive Dashboard synthetic sources.
# Every number that shapes the data story lives here. The generator is fully
# deterministic for a given (seed, config) pair.

seed: 20260531

# Which ta-exec-db release and commit this configuration implements. Recorded in the
# run manifest so a delivered dataset always names the contract it was built against.
contract:
  repository: bremlydvillasenor/ta-exec-db
  release: "1.3"
  commit: 87f8cf26795e0d15c1a57f14bf7fb485e959fcc5

dates:
  history_start: 2024-01-01      # first day any actual ATS / HR event may occur
  as_of: 2026-05-31              # reporting as-of date; no actual event after this day
  future_thd_end: 2027-05-31     # latest Target Hire Date preserved as planned demand

# Raw extraction and change metadata. These are UTC timestamps, never business dates,
# and never a metric date basis. Configuring extracted_at (instead of reading the clock)
# is what keeps the batch reproducible.
timestamps:
  extracted_at: 2026-05-31T23:59:59Z      # export time stamped on every row of every file
  reference_updated_at: 2023-12-01T09:00:00Z  # last label/code change on the lookup files
  change_hour_min: 8             # updated_at falls inside this UTC hour window on the
  change_hour_max: 20            # day the record actually changed
  updated_at_available: true     # a real export without a reliable change timestamp sets
                                 # this to false and is reloaded by full comparison

output:
  directory: data/raw

# ------------------------------------------------------------------ demand plan
demand:
  base_positions_per_month: 100  # positions with THD in Jan 2024
  monthly_growth_rate: 0.015     # compounding month over month
  seasonality: [1.15, 1.10, 1.05, 1.00, 0.95, 0.90, 0.85, 0.90, 1.05, 1.00, 0.90, 0.80]  # Jan..Dec
  # THD - approval date, in days. Most requisitions are approved 1-5 months before THD;
  # a minority are approved much earlier as part of the annual plan.
  approval_lead_days: {min: 25, mode: 60, max: 200}
  early_plan_share: 0.15
  # Annual-plan requisitions are approved up to ~15 months ahead, which is what keeps
  # planned demand visible all the way to future_thd_end (2027-05-31) rather than fading
  # out early: a THD in May 2027 needs an approval date on or before the as-of date.
  early_plan_lead_days: {min: 150, mode: 260, max: 450}
  # Minimum gap between approval and THD after clamping to history_start.
  min_thd_gap_days: 21

# ------------------------------------------------------------------ story episodes
episodes:
  hiring_surge:                  # rushed growth hiring: faster cycles, looser bar, more early exits
    start: 2025-05-01
    end: 2025-08-31
    demand_multiplier: 1.30
    cycle_time_multiplier: 0.78
    pass_rate_multiplier: 1.12
    early_attrition_multiplier: 2.30
  hiring_freeze:                 # budget freeze: cancellations and employer rescinds spike
    start: 2024-10-01
    end: 2024-11-30
    cancellation_probability: 0.22
    rescind_multiplier: 6.0

# ------------------------------------------------------------------ requisition lifecycle
requisitions:
  base_cancellation_probability: 0.05
  cancellation_day_range: [15, 120]          # days after approval
  stale_cancel_probability: 0.65             # give up on a requisition still open long after THD
  stale_cancel_days_after_thd: [120, 240]
  partial_cancel_probability: 0.07           # multi-seat requisitions that lose some seats
  partial_cancel_day_range: [60, 200]
  rebaseline_probability: 0.40               # push THD/TOAD out after TOAD is missed
  rebaseline_delay_days: [7, 30]
  rebaseline_shift_days: [45, 90]
  second_rebaseline_probability: 0.35
  snapshot_keep_days_after_close: 120        # monthly extracts stop this long after closure;
                                             # the as-of extract still covers every requisition
  recruiter_count: 22
  hiring_manager_count: 160
  locations: [Austin, Toronto, London, Dublin, Berlin, Remote]

# ------------------------------------------------------------------ candidate funnel
funnel:
  stages: [review, screen, assessment, interview, offer]
  stage_sla_days: [3, 4, 4, 5, 3]            # from the contract seed; used only for documentation
  duration_sigma: 0.55                       # lognormal spread of stage durations
  burst_window_days: 45                      # initial sourcing burst after approval / reopening
  trickle_rate_share: 0.20                   # ongoing arrivals per 30 days as a share of apps_per_position
  reopen_burst_share: 0.60                   # smaller burst when a seat reopens after a loss
  max_applications_per_requisition: 400
  pipeline_cut_lag_days: [0, 7]              # days after fill before remaining candidates are dispositioned
  cut_withdrawn_share: 0.20                  # share of cut candidates recorded as withdrawn vs rejected
  withdrawn_share_of_exits: 0.18             # share of pre-offer exits that are candidate withdrawals
  offer_withdrawn_share: 0.04                # employer withdraws an extended offer before acceptance
  candidate_pool_reuse: 0.12                 # draw rate for reusing an earlier candidate; the realised
                                             # share is lower because the donor must be an earlier
                                             # application and must not create an impossible person
                                             # (two live acceptances, or applying while already hired)
  disposition_reasons:
    rejected: [not_qualified, experience_mismatch, assessment_failed, interview_feedback, position_filled]
    withdrawn: [accepted_other_offer, no_response, compensation_expectations, location, personal]

# ------------------------------------------------------------------ offers and post-acceptance
offers:
  # Contract 1.3 keeps ONE current offer row per application. A revision therefore edits
  # that row and advances updated_at; it never creates a second offer or acceptance.
  negotiation_revision_probability: 0.18     # salary revised and the letter re-issued before the candidate responds
  admin_revision_probability: 0.14           # accepted offer edited afterwards (salary correction, moved start, letter re-issue)
  admin_revision_reasons: [start_date_revision, salary_correction, letter_reissue]
  start_date_revision_days: [7, 21]
  base_rescind_probability: 0.012
  currency: USD

# ------------------------------------------------------------------ HR outcomes
hr:
  duplicate_hire_event_share: 0.02
  duplicate_termination_share: 0.03
  duplicate_termination_shift_days: [1, 10]
  late_attrition_annual_rate: 0.14           # terminations after day 60
  early_tenure_days: [3, 60]
  termination_reasons:
    early: [voluntary_resignation, voluntary_resignation, voluntary_resignation, involuntary_performance, involuntary_probation]
    late: [voluntary_resignation, voluntary_resignation, involuntary_performance, involuntary_restructuring]

# ------------------------------------------------------------------ story summary
# Mirrors of governed reference values from ta-exec-db (ref_reporting_config). They are
# used only by the indicative story summary and its tests, never by the raw outputs.
story:
  forecast_min_segment_observations: 30   # smallest segment a stage yield may be trained on
  fill_rate_target: 0.90
  risk_high_max_days: 7                   # ref_risk_band: Missed <0, High 0-7, Medium 8-14, On Track >=15
  risk_medium_max_days: 14

# ------------------------------------------------------------------ segments
business_units:
  - {code: ENG, name: Engineering,                weight: 0.32, sort_order: 1}
  - {code: PRD, name: Product & Marketing,        weight: 0.11, sort_order: 2}
  - {code: SAL, name: Sales,                      weight: 0.22, sort_order: 3}
  - {code: CSX, name: Customer Success,           weight: 0.14, sort_order: 4}
  - {code: OPS, name: Operations,                 weight: 0.13, sort_order: 5}
  - {code: GNA, name: General & Administrative,   weight: 0.08, sort_order: 6}

# Job family mix inside each business unit (weights are normalised).
business_unit_job_family_mix:
  ENG: {SWE: 0.62, DAT: 0.22, ITS: 0.16}
  PRD: {PDM: 0.45, MKT: 0.45, DAT: 0.10}
  SAL: {SLS: 0.85, MKT: 0.05, OPS: 0.10}
  CSX: {CSM: 0.80, OPS: 0.15, DAT: 0.05}
  OPS: {OPS: 0.75, ITS: 0.10, DAT: 0.15}
  GNA: {FIN: 0.45, PPL: 0.40, ITS: 0.15}

job_levels:
  - {code: L1, name: Associate,    level_rank: 1, weight: 0.16, duration_multiplier: 0.85, interview_pass_multiplier: 1.05, toad_lead_days: 21, notice_days: 14, attrition_multiplier: 1.35}
  - {code: L2, name: Professional, level_rank: 2, weight: 0.33, duration_multiplier: 0.95, interview_pass_multiplier: 1.00, toad_lead_days: 30, notice_days: 21, attrition_multiplier: 1.10}
  - {code: L3, name: Senior,       level_rank: 3, weight: 0.29, duration_multiplier: 1.05, interview_pass_multiplier: 0.95, toad_lead_days: 30, notice_days: 30, attrition_multiplier: 0.90}
  - {code: L4, name: Lead,         level_rank: 4, weight: 0.12, duration_multiplier: 1.20, interview_pass_multiplier: 0.88, toad_lead_days: 45, notice_days: 30, attrition_multiplier: 0.75}
  - {code: L5, name: Manager,      level_rank: 5, weight: 0.07, duration_multiplier: 1.35, interview_pass_multiplier: 0.82, toad_lead_days: 60, notice_days: 45, attrition_multiplier: 0.65}
  - {code: L6, name: Director,     level_rank: 6, weight: 0.03, duration_multiplier: 1.60, interview_pass_multiplier: 0.75, toad_lead_days: 75, notice_days: 60, attrition_multiplier: 0.55}

